[package]
name = "rlcg"
version = "0.3.1"
edition = "2024"
readme = "README.md"
license = "MIT"
keywords = ["Lchain_codes", "Lucas Chain"]

[dependencies]
crossbeam-channel = { version = "0.5.17", features = ["std"], default-features = false }
indicatif = { version = "0.18.6", default-features = false }
primal = { version = "0.3.3", features = ["unstable"], default-features = false }
rayon = { version = "1.12.0", default-features = false }

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
strip = true